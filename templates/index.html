<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enteacher</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1f2a44 0%, #27355c 100%);
            display: flex;
            flex-direction: column;
            color: #fff;
        }

        /* TOP BAR */
        .top_bar {
            height: 72px;
            display: flex;
            align-items: center;
            padding: 0 30px;
            background: rgba(23, 32, 57, 0.95);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 10px 20px rgba(0,0,0,.25);
        }

        .app_name {
            font-size: 34px;
            font-family: Oxanium, sans-serif;
            font-weight: bold;
            color: #5d8eff;
        }

            .app_name span {
                color: white;
            }

        .nav_buttons {
            margin-left: auto;
            display: flex;
            gap: 12px;
        }

        .login_button {
            background: linear-gradient(135deg, #5d8eff, #4c6fff);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 10px 18px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: .2s;
        }

            .login_button:hover {
                transform: translateY(-2px);
                box-shadow: 0 10px 20px rgba(76,111,255,.25);
            }

        /* CONTENT */
        .page_content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 500px;
            background: rgba(23, 32, 57, 0.95);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25), 0 0 20px rgba(76, 125, 255, 0.08);
        }

        .title {
            text-align: center;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #9fb0d6;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 18px;
        }

        label {
            margin-bottom: 8px;
            font-size: 14px;
            color: #b9c7e6;
        }

        input {
            height: 46px;
            border: 1px solid #3b4d79;
            border-radius: 10px;
            background: #1a2542;
            color: white;
            padding: 0 14px;
            font-size: 15px;
            transition: .2s;
        }

            input:focus {
                outline: none;
                border-color: #5d8eff;
                box-shadow: 0 0 0 3px rgba(93,142,255,.15);
            }

        .button_next {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #5d8eff, #4c6fff);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: .2s;
        }

            .button_next:hover {
                transform: translateY(-2px);
                box-shadow: 0 10px 20px rgba(76,111,255,.25);
            }
    </style>
</head>

<body>

    <div class="top_bar">
        <div class="app_name">
            <span>En</span>teacher
        </div>

        <div class="nav_buttons">
            <button onclick="openLists()" class="login_button">Lists</button>
            <button class="login_button">Login</button>
        </div>
    </div>

    <div class="page_content">

        <div class="card">

            <h2 class="title">Vocabulary Trainer</h2>
            <p class="subtitle">Translate the displayed word</p>

            <div class="form-group">
                <label for="question">Word</label>
                <input id="question" name="question" />
            </div>

            <div class="form-group">
                <label for="answer">Answer</label>
                <input id="answer" name="answer" />
            </div>

            <button class="button_next">Next</button>

        </div>

    </div>

    <script>
        function openLists() {
            window.location.href = "/show_list";
        }
    </script>

</body>
</html>
