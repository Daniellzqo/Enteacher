<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All lists</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1f2a44 0%, #27355c 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
        }

        /* TOP */
        .top_bar {
            height: 72px;
            display: flex;
            align-items: center;
            padding: 0 30px;
            background: rgba(23, 32, 57, 0.95);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .app_name {
            font-size: 34px;
            font-weight: bold;
            color: #5d8eff;
        }

            .app_name span {
                color: white;
            }

        .nav_buttons {
            margin-left: auto;
            display: flex;
            gap: 12px;
        }

        .login_button {
            background: linear-gradient(135deg, #5d8eff, #4c6fff);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 10px 18px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        /* PAGE */
        .page_content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 30px;
            gap: 30px;
        }

        .card {
            width: 100%;
            max-width: 900px;
            background: rgba(23, 32, 57, 0.95);
            border-radius: 18px;
            padding: 25px;
        }

        .title {
            font-size: 26px;
            margin-bottom: 15px;
        }

        /* TABLE */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 12px;
            background: #1a2542;
            color: #b9c7e6;
        }

        td {
            padding: 12px;
            border-top: 1px solid rgba(255,255,255,0.06);
            cursor: pointer;
        }

        tr:hover td {
            background: rgba(93,142,255,0.08);
        }

        /* WORD PANEL */
        #words_box {
            width: 100%;
            max-width: 420px;
        }

        /* BUTTONS */
        .action_btn {
            background: rgba(93, 142, 255, 0.12);
            border: 1px solid rgba(93, 142, 255, 0.35);
            color: #cfe0ff;
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }

            .action_btn.primary {
                background: linear-gradient(135deg, #5d8eff, #4c6fff);
                border: none;
                color: white;
            }

        /* FORM */
        .form_card {
            margin-top: 10px;
            padding: 18px;
            border-radius: 14px;
            background: rgba(23, 32, 57, 0.9);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .form_label {
            font-size: 13px;
            color: #b9c7e6;
        }

        .form_card input {
            width: 100%;
            margin: 6px 0 12px;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(15,22,40,0.8);
            color: white;
        }
    </style>
</head>

<body>

    <div class="top_bar">
        <div class="app_name"><span>En</span>teacher</div>

        <div class="nav_buttons">
            <button class="login_button" onclick="goHome()">Trainer</button>
            <button class="login_button" onclick="openLists()">Lists</button>
            <button class="login_button">Login</button>
        </div>
    </div>

    <div class="page_content">

        <div class="card">

            <div class="title">All lists</div>

            <table>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                </tr>

                {% for li in lists %}
                <tr onclick="loadWords({{ li.id }})">
                    <td>{{ li.id }}</td>
                    <td>{{ li.listname }}</td>
                </tr>
                {% endfor %}

            </table>

        </div>

        <div id="words_box"></div>

    </div>

    <script>

        async function loadWords(id) {

            const params = new URLSearchParams({
                lang: "en",
                id: id
            });

            const response = await fetch("/show_words/" + id + "?" + params);
            const html = await response.text();

            document.getElementById("words_box").innerHTML = html;
        }

        async function showWordTransl(id, listid) {

            let html = '';

            if (id < 1) {
                const response = await fetch("/new_word/" + listid);
                html = await response.text();
            } else {
                const response = await fetch("/edit_words/" + id + "?" + listid);
                html = await response.text();
            }

            document.getElementById("words_box").innerHTML = html;
        }

        function openLists() {
            window.location.href = "/show_list";
        }

        function goHome() {
            window.location.href = "/";

        }

        async function showWordTransl(id, listid) {

            console.log("CLICK:", id, listid);

            let url;

            if (id < 0) {
                url = `/new_word/${listid}`;
            } else {
                url = `/edit_words/${id}?listid=${listid}`;
            }

            console.log("URL:", url);

            const response = await fetch(url);
            const html = await response.text();

            document.getElementById("words_box").innerHTML = html;
        }



    </script>

</body>
</html>
