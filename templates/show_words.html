<div class="form_card" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">

    <div style="font-size:16px; font-weight:600; color:#cfe0ff;">
        Words
    </div>

    <button class="action_btn primary"
            onclick="showWordTransl(-1, {{ listid or 0 }})">
        + Add new word
    </button>

</div>

<table>
    {% for w in words %}
    <tr onclick="showWordTransl({{ w.id }}, {{ listid }})">
        <td>{{ w.word }}</td>
        <td>{{ w.translation }}</td>
    </tr>
    {% endfor %}
</table>
